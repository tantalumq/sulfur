[package]
name = "sulfur-archive"
version = "0.1.0"
edition = "2024"
description = "Small and fast file archiver"
license = "MIT OR Apache-2.0"
readme = "../README.md"

[dependencies]
thiserror = "2.0.18"
walkdir = "2.5.0"
tempfile = "3.27.0"
fd-lock = "4.0.4"
zstd = "0.13.3"
crc32fast = "1.5.0"


[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false

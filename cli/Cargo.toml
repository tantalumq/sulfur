[package]
name = "slf-cli"
version = "0.1.2"
edition = "2024"
description = "CLI for Sulfur file archiver"
license = "MIT OR Apache-2.0"
readme = "../README.md"
repository = "https://github.com/tantalumq/sulfur"
keywords = ["archive", "compression", "zstd", "cli", "filesystem"]
categories = ["command-line-utilities", "compression", "filesystem"]


[[bin]]
name = "slf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
sulfur-archive = { path = "../core", version = "0.1.2" }

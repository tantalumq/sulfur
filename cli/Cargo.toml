[package]
name = "slf-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for Sulfir file archiver"
license = "MIT OR Apache-2.0"
readme = "../README.md"

[[bin]]
name = "slf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
sulfur-archive = { path = "../core", version = "0.1.0" }
